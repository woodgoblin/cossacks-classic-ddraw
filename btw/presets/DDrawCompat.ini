; Cossacks: Back to War - classic 4:3 DirectDraw on Windows 11
; Preset for DDrawCompat (https://github.com/narzoul/DDrawCompat)
;
; Steam BTW loads SYSTEM ddraw.dll. DDrawCompat must be named dciman32.dll.
; Do not also drop ddraw.dll in this folder (double wrapper -> init failure).

; Present target is the largest monitor's native physical mode.
; The game framebuffer stays 1024x768 or 800x600 4:3.

EnableDDrawCompat = on
LogLevel = info

FullscreenMode = borderless
DisplayResolution = desktop
DisplayAspectRatio = 4:3
DisplayFilter = point
DisplayRefreshRate = desktop

BltFilter = point
RenderColorDepth = app
ColorKeyMethod = alphatest(1)
ResolutionScale = app(1)
ResolutionScaleFilter = point
TextureFilter = app
Antialiasing = off
PalettizedTextures = on
SoftwareDevice = rgb
AlternatePixelCenter = off

SupportedResolutions = native, 640x480, 800x600, 1024x768
SupportedRefreshRates = native

AltTabFix = keepvidmem(1)
VSync = on
FpsLimiter = msgloop(60)
PresentDelay = on(10)

CpuAffinity = all
CpuAffinityRotation = off
CompatFixes = nowindowborders
DpiAwareness = app
GdiInterops = all
WinVersionLie = off
ForceD3D9On12 = off

DesktopColorDepth = initial
DesktopResolution = desktop
MousePollingRate = 125
MouseSensitivity = desktop(100)

ConfigHotKey = shift+f11
TerminateHotKey = ctrl+alt+end
