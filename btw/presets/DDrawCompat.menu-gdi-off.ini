; Fallback if the main menu still freezes: stop mixing GDI into DirectDraw.
; Use: Install-CossacksClassic.ps1 -Preset menu-gdi-off

EnableDDrawCompat = on
LogLevel = info

FullscreenMode = borderless
DisplayResolution = desktop
DisplayAspectRatio = 4:3
DisplayFilter = point
DisplayRefreshRate = desktop

BltFilter = point
RenderColorDepth = app
ColorKeyMethod = alphatest(1)
ResolutionScale = app(1)
ResolutionScaleFilter = point
TextureFilter = app
Antialiasing = off
PalettizedTextures = off
SoftwareDevice = rgb
AlternatePixelCenter = off

SupportedResolutions = 800x600, 1024x768
SupportedRefreshRates = desktop, 60

AltTabFix = noactivateapp(1)
VSync = on
FpsLimiter = msgloop(60)
PresentDelay = on(10)

CpuAffinity = 1
CpuAffinityRotation = off
CompatFixes = singlemonitor,nowindowborders
DpiAwareness = permonitor
GdiInterops = none
WinVersionLie = off
ForceD3D9On12 = off

DesktopColorDepth = initial
DesktopResolution = desktop
MousePollingRate = 125
MouseSensitivity = desktop(100)

ConfigHotKey = shift+f11
TerminateHotKey = ctrl+alt+end
